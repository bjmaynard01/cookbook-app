[project]
name = "cookbook"
version = "0.1.0"
description = "Maynard family cookbook"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncmy>=0.2.10",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "anyio>=4",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
